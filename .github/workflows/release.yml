name: Publish portable release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Validate release metadata
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          ./scripts/Validate-Release.ps1 -Version $version

      - name: Build release
        run: dotnet publish native-winui/VitanCut.WinUI.csproj -c Release -r win-x64 --self-contained true -o release-app

      - name: Run core checks
        shell: pwsh
        run: |
          $env:VITANCUT_TEST_ROOT = Join-Path $env:RUNNER_TEMP 'vitancut-release-checks'
          dotnet run --project native-winui-tests/VitanCut.CoreChecks.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "Core checks failed" }

      - name: Pack portable archive
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          ./scripts/Stage-Portable.ps1 -BuildDirectory "release-app" -OutputDirectory "release-artifacts" -Version $version

      - name: Load version-specific release notes
        id: notes
        shell: pwsh
        run: |
          $notes = "release-notes/${{ github.ref_name }}.md"
          if (-not (Test-Path $notes)) { throw "Missing version-specific release notes: $notes" }
          "path=$notes" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            release-artifacts/VitanCut-portable-win-x64-*.zip
            release-artifacts/VitanCut-portable-win-x64-*.zip.sha256
