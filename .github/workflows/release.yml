name: Publish portable release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build release
        run: dotnet build native-winui/VitanCut.WinUI.csproj -c Release -p:Platform=x64

      - name: Pack portable archive
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $source = "native-winui/bin/x64/Release/net8.0-windows10.0.26100.0/win-x64"
          $archive = "VitanCut-portable-win-x64-$version.zip"
          Compress-Archive -Path "$source/*" -DestinationPath $archive -CompressionLevel Optimal

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: VitanCut-portable-win-x64-*.zip
